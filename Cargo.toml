[package]
name = "mdgreet"
version = "0.2.0"
edition = "2024"
description = "A clean Material Design 3 greeter for greetd in Rust and Slint"
repository = "https://github.com/MOIS3Y/mdgreet"
license = "GPL-3.0-or-later"
keywords = ["greetd", "greeter", "wayland", "slint", "material-design"]
categories = ["gui", "system::hardware"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
css-color-parser2 = "1.0.1"
figment = { version = "0.11.5", package = "figment2", features = ["toml"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
greetd_ipc = { version = "0.10.3", features = ["tokio-codec"] }
image = "0.25.10"
lru = "0.19.0"
material-colors = { version = "0.5.0", features = ["quantize"] }
pwd = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
slint = { version = "1.18.1", features = ["std", "gettext"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time", "time"] }
zbus = "6.2.0"

[build-dependencies]
slint-build = "1.18.1"


[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
